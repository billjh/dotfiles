[settings]
idiomatic_version_file_enable_tools = ["node", "ruby", "python", "java", "terraform"]
self_update.auto = true
self_update.check_duration = "24h"

[tools]
eza = "latest"
gh = "latest"
go = "latest"
golangci-lint = "latest"
goreleaser = "latest"
mas = "latest"
ruby = "latest"
starship = "latest"

[shell_alias]
mup = "(YES=packages,repos; mise bootstrap --adopt billjh/dotfiles --update --upgrade --only $YES --yes && mise bootstrap --upgrade --skip $YES)"
ls = "eza --icons --hyperlink --octal-permissions --git-repos --all"
ll = "ls --long"
".." = "cd .."

[dotfiles]
"~/.config/starship.toml" = { source = ".config/starship.toml", mode = "copy" }
"~/.config/wezterm/wezterm.lua" = { source = ".config/wezterm/wezterm.lua", mode = "copy" }
"~/.gitconfig" = { source = ".gitconfig", mode = "copy" }
"~/.zprofile/homebrew-prefix" = { line = 'export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"', position = "prepend" } # support brew-less setup
"~/.zshenv/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"' } # https://mise.jdx.dev/bootstrap/shell.html#put-mise-on-path-first
"~/.zshrc/interactive" = { source = ".zshrc", template = "tera" }

[bootstrap.hooks]
pre-packages = '"{{ mise_bin }}" install mas' # before installing "mas:*"" packages

[bootstrap.user]
login_shell = "/bin/zsh" # macOS system zsh

[bootstrap.mise_shell_activate]
zsh = true

[bootstrap.repos]
# -----------
# zsh plugins
"~/.local/share/zsh/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git", ref = "master" }
"~/.local/share/zsh/plugins/zsh-history-substring-search" = { url = "https://github.com/zsh-users/zsh-history-substring-search.git", ref = "master" }
"~/.local/share/zsh/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git", ref = "master" }
# -----------

[bootstrap.packages]
"brew:watch" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:font-lilex-nerd-font" = "latest"
"brew-cask:monitorcontrol" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:wezterm" = "latest"
"mas:1136220934" = "latest" # Infuse
"mas:1569813296" = "latest" # 1Password for Safari
"mas:6746388723" = "latest" # wBlock

# ------------------------------------------------------
# [bootstrap.macos.*] configure macOS defaults
# see https://mise.jdx.dev/bootstrap/macos-defaults.html

[bootstrap.macos.dock]
autohide = false
orientation = "bottom" # bottom, left or right
tilesize = 50
magnification = true
largesize = 80
show_recents = false
mru_spaces = false
# apps = [] # TODO: add once all apps are managed by mise

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
show_extensions_warning = false
preferred_view_style = "list" # icon, list, column or gallery

[bootstrap.macos.keyboard]
key_repeat = 1
initial_key_repeat = 15
press_and_hold = false
automatic_capitalization = false
automatic_spelling_correction = false

[bootstrap.macos.trackpad]
tap_to_click = true
three_finger_drag = true

[bootstrap.macos.defaults."com.apple.finder"]
NewWindowTarget = "PfHm" # Home folder

[bootstrap.macos.defaults."com.apple.menuextra.clock"]
ShowSeconds = true

[bootstrap.macos.defaults.NSGlobalDomain]
AppleShowAllExtensions = true
# ------------------------------------------------------
