[bootstrap.hooks]
pre-tools = 'mkdir -p ~/.local/share/zsh/site-functions' # Tool postinstalls write completions here
post-tools = '"{{ mise_bin }}" completion zsh > ~/.local/share/zsh/site-functions/_mise' # mise has no postinstall; mise_bin works before PATH has it

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.mise_shell_activate]
zsh = true

[bootstrap.repos]
"~/.local/share/zsh/plugins/zsh-autosuggestions" = { url = "https://github.com/zsh-users/zsh-autosuggestions.git" }
"~/.local/share/zsh/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git" }
"~/.local/share/zsh/plugins/zsh-history-substring-search" = { url = "https://github.com/zsh-users/zsh-history-substring-search.git" }

[tools]
eza = "latest"
starship = "latest"

[shell_alias]
mup = "mise bootstrap --adopt billjh/dotfiles --update --upgrade"
ls = "eza --icons --hyperlink --octal-permissions --git-repos --all"
ll = "ls --long"
".." = "cd .."

[dotfiles]
"~/.config/starship.toml" = { source = ".config/starship.toml", mode = "symlink" }
"~/.zshrc/interactive" = { source = ".zshrc", template = "tera" }
"~/.zshenv/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"' }
"~/.zprofile/homebrew-prefix" = { line = 'export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"', position = "prepend" } # brew shellenv without brew; .zprofile runs after path_helper, prepend keeps mise ahead
